# Keeps the ACO app (Render free tier) from sleeping: Render spins a free service down
# after 15 idle minutes. 24 h x 31 days = 744 instance-hours/month, inside Render's 750 free hours
# (as long as this is the only free web service in the workspace).
name: Keep ACO awake

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may delay scheduled runs by a few minutes
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping ACO health
        run: |
          for url in https://app.yugatime.space/api/health https://aco-app.onrender.com/api/health; do
            for i in 1 2 3; do
              code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 70 "$url" || true)
              if [ "$code" = "200" ]; then echo "OK $url -> $(cat /tmp/body)"; exit 0; fi
              echo "try $i: $url -> $code"; sleep 10
            done
          done
          echo "ACO did not answer"; exit 1
